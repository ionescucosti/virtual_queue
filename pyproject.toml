[project]
name = "virtual-queue"
version = "0.1.0"
description = "Modular FastAPI app with uv, .env, logging, and tests"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-dotenv",
  "sqlalchemy",
  "psycopg2-binary",
  "bcrypt",
  "resend",
  "python-jose[cryptography]",
  "passlib[bcrypt]",
  "python-multipart",
  "email-validator",
  "redis",
  "websockets"
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx"
]

[tool.uv]
# uv specific config if needed

[build-system]
requires = ["uv"]
build-backend = "uv.build"

